name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.8" }
      - run: pip install -r app/requirements.txt
      - run: python -m py_compile app/main.py

  unit_tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.8" }
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -v tests/

  # SAST: blocks on HIGH severity findings
  sast_bandit:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit
      - run: mkdir -p reports
      - run: bandit -r app -f json -o reports/bandit.json --severity-level high
      - if: always()
        run: bandit -r app -f html -o reports/bandit.html || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: bandit-report, path: reports/ }

  # Secrets: blocks on any secret found
  secrets_scan:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source /repo --report-format json
          --report-path /repo/reports/gitleaks.json --exit-code 1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gitleaks-report, path: reports/ }

  # SCA: blocks on CRITICAL dependency vulnerabilities
  scan_dependencies:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs
          --scanners vuln --severity CRITICAL --exit-code 1
          --format json --output /src/reports/trivy-deps.json /src/app/requirements.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: trivy-deps-report, path: reports/ }

  # IaC + Dockerfile: blocks on failed checks
  iac_scan:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v "$PWD:/src" bridgecrew/checkov:latest
          -d /src --framework terraform dockerfile
          -o json --output-file-path /src/reports
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: checkov-report, path: reports/ }

  # Docker image scan: blocks on CRITICAL
  docker_scan:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app .
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/reports:/out" aquasec/trivy:latest image
          --severity CRITICAL --exit-code 1
          --format json --output /out/trivy-image.json devsecops-app
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: trivy-image-report, path: reports/ }

  # SBOM: never blocks, inventory only
  sbom:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app .
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/reports:/out" anchore/syft:latest devsecops-app
          -o cyclonedx-json=/out/sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: reports/ }
