name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/requirements.txt
      - run: python -m py_compile app/main.py

  unit_tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -v tests/

  sast_bandit:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit
      - run: mkdir -p reports
      - run: bandit -r app -f json -o reports/bandit.json --severity-level medium
      - if: always()
        run: bandit -r app -f html -o reports/bandit.html || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: bandit-report, path: reports/ }

  secrets_scan:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source /repo --config /repo/.gitleaks.toml
          --baseline-path /repo/gitleaks-baseline.json
          --report-format json --report-path /repo/reports/gitleaks.json
          --exit-code 1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gitleaks-report, path: reports/ }

  scan_dependencies:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs
          --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          --format json --output /src/reports/trivy-deps.json /src/app/requirements.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: trivy-deps-report, path: reports/ }

  iac_scan:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v "$PWD:/src" bridgecrew/checkov:latest
          -d /src --framework terraform dockerfile
          -o json --output-file-path /src/reports
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: checkov-report, path: reports/ }

  docker_scan:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app .
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/reports:/out" aquasec/trivy:latest image
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          --format json --output /out/trivy-image.json devsecops-app
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: trivy-image-report, path: reports/ }

  sbom:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app .
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/reports:/out" anchore/syft:latest devsecops-app
          -o cyclonedx-json=/out/sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: reports/ }

  dast_zap:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app .
      - run: docker network create zapnet
      - run: docker run -d --name app --network zapnet -e SECRET_KEY=ci-test devsecops-app
      - run: sleep 5
      - run: mkdir -p reports && chmod 777 reports
      - run: >
          docker run --rm --network zapnet -v "$PWD:/zap/wrk:rw"
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py
          -t http://app:5000 -c .zap-rules.tsv
          -r reports/zap-report.html -J reports/zap-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: zap-report, path: reports/ }

  publish_image:
    needs: [build, unit_tests, sast_bandit, secrets_scan, scan_dependencies, iac_scan, docker_scan, sbom, dast_zap]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy_staging:
    needs: [publish_image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy to staging and smoke test
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${{ github.sha }}
          docker pull $IMAGE
          docker run -d --name staging -p 5000:5000 -e SECRET_KEY=${{ secrets.SECRET_KEY }} $IMAGE
          sleep 5
          curl -f http://localhost:5000/health
          docker rm -f staging

  notify:
    needs: [build, unit_tests, sast_bandit, secrets_scan, scan_dependencies, iac_scan, docker_scan, sbom, dast_zap, publish_image, deploy_staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          URL=$(printf '%s' "$WEBHOOK_URL" | tr -d '[:space:]')
          if [ -z "$URL" ]; then echo "Secret WEBHOOK_URL vide ou absent"; exit 1; fi
          if [ "$FAILED" = "true" ]; then MSG="[ECHEC] Pipeline"; else MSG="[OK] Pipeline"; fi
          curl -sS --fail -H "Content-Type: application/json" -d "{\"content\":\"$MSG - $REPO ($BRANCH, ${SHA:0:7}) $RUN_URL\"}" "$URL"
